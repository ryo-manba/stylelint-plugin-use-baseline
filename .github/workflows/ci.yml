name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Check PR title format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\(.+\))?!?:\ .+ ]]; then
            echo "❌ PR title must follow Conventional Commits format"
            echo "Format: type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert"
            exit 1
          fi
          echo "✅ PR title format is valid"

      - name: Run ESLint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: pnpm test

  compatibility:
    name: Stylelint ${{ matrix.stylelint-version }} compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        stylelint-version: [16, 17, 18]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Test the published package layout
        env:
          STYLELINT_VERSION: ${{ matrix.stylelint-version }}
        run: |
          pnpm run build
          consumer_dir=$(mktemp -d)
          npm pack --pack-destination "$consumer_dir"

          cd "$consumer_dir"
          npm init --yes
          npm install --strict-peer-deps --no-audit --no-fund \
            "stylelint@^${STYLELINT_VERSION}.0.0" ./*.tgz

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import stylelint from "stylelint";

          const ruleName = "plugin/use-baseline";
          const config = {
            plugins: ["stylelint-plugin-use-baseline"],
            rules: { [ruleName]: true },
          };

          const accepted = await stylelint.lint({ code: "a { color: red; }", config });
          assert.equal(accepted.errored, false);
          assert.deepEqual(accepted.results[0].warnings, []);

          const rejected = await stylelint.lint({ code: "a { accent-color: red; }", config });
          assert.equal(rejected.errored, true);
          assert.equal(rejected.results[0].warnings.length, 1);
          assert.equal(rejected.results[0].warnings[0].rule, ruleName);
          NODE
